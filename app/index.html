<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinGenius 360 — Il tuo coach di educazione finanziaria</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<style>
  :root {
    --navy: #0A2540;
    --navy-2: #13355C;
    --teal: #00B3A4;
    --teal-dark: #008C80;
    --teal-soft: #E0F7F5;
    --gold: #F5B700;
    --gold-soft: #FFF6D6;
    --bg: #EEF3F7;
    --ink: #1B2B3A;
    --muted: #6B7C8F;
    --line: #DCE4EC;
    --ok: #1FA971;
    --ok-soft: #E3F6EC;
    --ko: #E5484D;
    --ko-soft: #FDECEC;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
    color: var(--ink);
    background: var(--navy);
    background-image: radial-gradient(circle at 15% 20%, rgba(0,179,164,.25), transparent 40%),
                      radial-gradient(circle at 85% 80%, rgba(245,183,0,.18), transparent 40%);
  }

  .app { height: 100vh; max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; background: var(--bg); box-shadow: 0 0 60px rgba(0,0,0,.35); }

  /* Topbar */
  .topbar { flex: none; display: flex; align-items: center; gap: .8rem; padding: .7rem 1.2rem; background: #fff; border-bottom: 1px solid var(--line); }
  .topbar .logo { width: 46px; height: 46px; }
  .brand { line-height: 1.15; }
  .brand .name { font-weight: 800; font-size: 1.15rem; color: var(--navy); letter-spacing: -.3px; }
  .brand .name span { color: var(--gold); }
  .brand .status { font-size: .75rem; color: var(--muted); display: flex; align-items: center; gap: .35rem; }
  .brand .status::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
  .progress { margin-left: auto; text-align: right; display: none; }
  .progress.visible { display: block; }
  .progress .phase { font-size: .7rem; font-weight: 700; color: var(--teal-dark); text-transform: uppercase; letter-spacing: .8px; margin-bottom: .3rem; }
  .dots { display: flex; gap: 5px; justify-content: flex-end; }
  .dots span { width: 22px; height: 6px; border-radius: 3px; background: var(--line); transition: background .3s; }
  .dots span.done { background: var(--teal); }
  .dots span.current { background: var(--gold); }

  /* Views */
  .view { display: none; flex: 1; min-height: 0; overflow-y: auto; scroll-behavior: smooth; }
  .view.active { display: block; }

  /* Chat */
  .chat-inner, .stage-body { display: flex; flex-direction: column; gap: .55rem; padding: 1.5rem 1.2rem 1.5rem; }
  .row { display: flex; gap: .6rem; max-width: 88%; animation: pop .25s ease-out; }
  .row.bot { align-self: flex-start; }
  .row.user { align-self: flex-end; flex-direction: row-reverse; }
  .row.wide { max-width: 100%; width: 100%; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .avatar { flex: none; width: 36px; height: 36px; border-radius: 50%; background: #fff; border: 1px solid var(--line); display: grid; place-items: center; align-self: flex-end; }
  .avatar svg { width: 30px; height: 30px; }
  .avatar.thinking svg { animation: float 1s ease-in-out infinite; }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  .row.bot + .row.bot .avatar { visibility: hidden; }
  .row.user + .row.bot, .row.bot + .row.user { margin-top: .6rem; }
  .stack { display: flex; flex-direction: column; gap: .4rem; min-width: 0; flex: 1; }

  .bubble { padding: .75rem 1rem; border-radius: 18px; font-size: .95rem; line-height: 1.55; background: #fff; box-shadow: 0 1px 2px rgba(10,37,64,.08); }
  .row.bot .bubble { border-bottom-left-radius: 6px; }
  .row.user .bubble { background: var(--navy); color: #fff; border-bottom-right-radius: 6px; }
  .bubble.scene { border-left: 4px solid var(--gold); }
  .bubble.question { background: var(--teal-soft); border: 2px solid var(--teal); font-weight: 600; font-size: 1.02rem; }
  .q-label { font-size: .7rem; font-weight: 800; text-transform: uppercase; letter-spacing: .9px; color: var(--teal-dark); margin-bottom: .25rem; }
  .bubble.reaction { background: var(--gold-soft); border: 2px solid var(--gold); }
  .bubble.reaction .q-label { color: #9A7300; }

  .typing { display: inline-flex; gap: 4px; padding: .9rem 1rem; width: fit-content; }
  .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  /* Options */
  .options { display: flex; flex-direction: column; gap: .45rem; }
  .opt { display: flex; align-items: center; gap: .7rem; text-align: left; width: 100%; padding: .75rem .95rem; border-radius: 14px; border: 2px solid var(--line); background: #fff; font: inherit; font-size: .93rem; color: var(--ink); cursor: pointer; transition: all .15s; }
  .opt:hover { border-color: var(--teal); transform: translateX(2px); }
  .opt .letter { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: .8rem; background: var(--bg); color: var(--navy); }
  .opt.selected { border-color: var(--teal); background: var(--teal); color: #fff; }
  .opt.selected .letter { background: #fff; color: var(--teal-dark); }
  .locked .opt { cursor: default; transform: none; }
  .locked .opt:not(.selected) { opacity: .4; }

  .pick { display: flex; align-items: center; gap: .5rem; font-weight: 600; }
  .pick-letter { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--gold); color: var(--navy); display: grid; place-items: center; font-size: .75rem; font-weight: 800; }
  .why { margin-top: .45rem; padding-top: .45rem; border-top: 1px solid rgba(255,255,255,.2); font-size: .88rem; opacity: .9; white-space: pre-wrap; }
  .why::before { content: 'Perché: '; font-weight: 700; color: var(--gold); }

  /* Answer card (stage) */
  .answer-card { background: #fff; border-radius: 16px; padding: .9rem 1rem; border: 2px solid var(--line); }
  .answer-card label { display: block; font-weight: 700; font-size: .88rem; color: var(--navy); margin-bottom: .45rem; }
  .answer-card label .req { color: var(--ko); font-size: .75rem; font-weight: 600; margin-left: .3rem; }
  .answer-card textarea { width: 100%; resize: none; border: 2px solid var(--line); border-radius: 12px; padding: .7rem .9rem; font: inherit; font-size: .93rem; line-height: 1.45; min-height: 64px; outline: none; transition: border-color .15s; }
  .answer-card textarea:focus { border-color: var(--teal); }
  .answer-card textarea::placeholder { color: #A3B1BF; }
  .answer-foot { display: flex; align-items: center; justify-content: space-between; gap: .8rem; margin-top: .6rem; flex-wrap: wrap; }
  .answer-foot .hint { font-size: .8rem; color: var(--muted); font-weight: 600; }

  /* Clusters */
  .clusters { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: .6rem; }
  .cluster { position: relative; text-align: left; padding: 1rem; border-radius: 16px; border: 2px solid var(--line); background: #fff; font: inherit; color: var(--ink); cursor: pointer; transition: all .15s; }
  .cluster .ico { font-size: 1.6rem; }
  .cluster .cname { font-weight: 700; margin: .35rem 0 .2rem; }
  .cluster .cdesc { font-size: .8rem; color: var(--muted); line-height: 1.4; }
  .cluster .tag { position: absolute; top: .7rem; right: .7rem; font-size: .65rem; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; padding: .2rem .5rem; border-radius: 20px; }
  .cluster.active { border-color: var(--teal); }
  .cluster.active .tag { background: var(--teal); color: #fff; }
  .cluster.active:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,179,164,.25); }
  .cluster.soon { filter: grayscale(.8); opacity: .7; }
  .cluster.soon .tag { background: var(--line); color: var(--muted); }
  .clusters.locked .cluster { pointer-events: none; }
  .clusters.locked .cluster:not(.chosen) { opacity: .35; }

  /* CTA */
  .cta { display: inline-flex; align-items: center; gap: .5rem; padding: .75rem 1.4rem; border: none; border-radius: 30px; background: var(--gold); color: var(--navy); font: inherit; font-weight: 800; font-size: .95rem; cursor: pointer; box-shadow: 0 4px 12px rgba(245,183,0,.35); transition: transform .15s; }
  .cta:hover { transform: translateY(-1px); }
  .cta:disabled { background: var(--line); color: var(--muted); box-shadow: none; cursor: default; transform: none; }
  .cta.small { padding: .5rem 1rem; font-size: .85rem; margin-top: .8rem; }

  /* Stage (interfaccia quiz) */
  .scene-banner { background: linear-gradient(135deg, var(--navy), var(--navy-2)); color: #fff; padding: 1.4rem 1.4rem 1.6rem; display: flex; align-items: center; gap: 1rem; border-radius: 0 0 24px 24px; }
  .scene-icon { flex: none; width: 66px; height: 66px; border-radius: 20px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15); font-size: 2.1rem; display: grid; place-items: center; }
  .scene-kicker { font-size: .72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: var(--gold); }
  .scene-title { font-size: 1.45rem; font-weight: 800; letter-spacing: -.3px; }
  .stage .avatar { width: 46px; height: 46px; }
  .stage .avatar svg { width: 40px; height: 40px; }
  .stage-enter { animation: pop .35s ease-out; }

  /* Agent card */
  .agent-card { background: var(--navy); color: #fff; border-radius: 16px; padding: 1rem 1.1rem; }
  .agent-title { font-weight: 700; margin-bottom: .6rem; font-size: .9rem; }
  .agent-step { display: flex; align-items: center; gap: .6rem; font-size: .85rem; padding: .3rem 0; opacity: .45; transition: opacity .3s; }
  .agent-step code { background: rgba(255,255,255,.12); padding: .1rem .4rem; border-radius: 4px; font-size: .78rem; color: var(--gold); }
  .agent-step .dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid rgba(255,255,255,.5); flex: none; }
  .agent-step.active { opacity: 1; }
  .agent-step.active .dot { border-color: var(--gold); border-top-color: transparent; animation: spin .7s linear infinite; }
  .agent-step.done { opacity: 1; }
  .agent-step.done .dot { background: var(--teal); border-color: var(--teal); }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Score */
  .score-card { display: flex; align-items: center; gap: 1rem; }
  .ring { flex: none; width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; }
  .ring-inner { width: 66px; height: 66px; border-radius: 50%; background: #fff; display: grid; place-items: center; font-weight: 800; font-size: 1.15rem; color: var(--navy); }
  .score-card h3 { font-size: 1.05rem; color: var(--navy); margin-bottom: .2rem; }
  .score-card p { font-size: .88rem; color: var(--muted); }

  /* Feedback */
  .bubble.fb-ok { border-left: 4px solid var(--ok); }
  .bubble.fb-ko { border-left: 4px solid var(--ko); }
  .bubble.fb-guess { border-left: 4px solid var(--gold); }
  .fb-head { font-size: .72rem; font-weight: 800; text-transform: uppercase; letter-spacing: .7px; margin-bottom: .3rem; }
  .fb-head.ok { color: var(--ok); }
  .fb-head.ko { color: var(--ko); }
  .fb-head.guess { color: #B98900; }

  /* Lessons */
  .lesson { background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 1px 3px rgba(10,37,64,.1); }
  .lesson-top { background: linear-gradient(90deg, var(--navy), var(--navy-2)); color: var(--gold); font-size: .7rem; font-weight: 800; text-transform: uppercase; letter-spacing: .9px; padding: .55rem 1rem; }
  .lesson-body { padding: 1rem; }
  .lesson h3 { color: var(--navy); font-size: 1.02rem; margin-bottom: .5rem; }
  .lesson p { font-size: .9rem; line-height: 1.65; }
  .takeaway { margin-top: .8rem; background: var(--gold-soft); border-left: 4px solid var(--gold); padding: .6rem .8rem; border-radius: 0 10px 10px 0; font-size: .87rem; font-weight: 600; color: var(--navy); }

  /* Final */
  .final { background: #fff; border-radius: 18px; padding: 1.3rem; box-shadow: 0 2px 8px rgba(10,37,64,.1); }
  .final h3 { color: var(--navy); margin-bottom: 1rem; font-size: 1.1rem; }
  .bar-row { display: grid; grid-template-columns: 56px 1fr 48px; align-items: center; gap: .7rem; margin-bottom: .7rem; font-size: .85rem; font-weight: 700; }
  .track { height: 14px; background: var(--bg); border-radius: 7px; overflow: hidden; }
  .fill { height: 100%; width: 0; border-radius: 7px; transition: width 1.1s cubic-bezier(.2,.8,.2,1); }
  .fill.before { background: var(--muted); }
  .fill.after { background: linear-gradient(90deg, var(--teal), var(--gold)); }
  .delta { margin: 1rem 0; padding: .9rem; border-radius: 14px; text-align: center; font-weight: 700; }
  .delta .big { font-size: 1.8rem; font-weight: 800; display: block; }
  .delta.up { background: var(--ok-soft); color: var(--ok); }
  .delta.same { background: var(--teal-soft); color: var(--teal-dark); }
  .delta.down { background: var(--ko-soft); color: var(--ko); }
  .chips { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .4rem; }
  .chip { background: var(--navy); color: #fff; padding: .3rem .7rem; border-radius: 20px; font-size: .75rem; font-weight: 600; }
  .disclaimer { margin-top: 1rem; font-size: .75rem; color: var(--muted); line-height: 1.5; }

  /* Playlist aula */
  .playlist { background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 1px 3px rgba(10,37,64,.1); }
  .pl-item { display: flex; align-items: center; gap: .8rem; padding: .75rem 1rem; border-bottom: 1px solid var(--line); }
  .pl-num { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: .85rem; background: var(--bg); color: var(--navy); }
  .pl-title { font-weight: 700; font-size: .92rem; color: var(--navy); }
  .pl-meta { font-size: .76rem; color: var(--muted); }
  .pl-status { margin-left: auto; font-size: .72rem; font-weight: 800; padding: .2rem .6rem; border-radius: 20px; background: var(--bg); color: var(--muted); white-space: nowrap; }
  .pl-item.next .pl-num { background: var(--gold); }
  .pl-item.done .pl-num { background: var(--teal); color: #fff; }
  .pl-item.done .pl-status { background: var(--teal-soft); color: var(--teal-dark); }
  .pl-foot { padding: .2rem 1rem 1rem; }

  /* Aula di Genius */
  .lesson-view { background: var(--bg); }
  .class-head { display: flex; align-items: center; gap: .8rem; padding: .9rem 1.2rem; background: linear-gradient(135deg, var(--navy), var(--navy-2)); color: #fff; }
  .class-head .scene-kicker { margin-bottom: .1rem; }
  .class-head h2 { font-size: 1.15rem; font-weight: 800; letter-spacing: -.2px; }
  .exit { margin-left: auto; flex: none; background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.25); border-radius: 20px; padding: .4rem .9rem; font: inherit; font-size: .8rem; font-weight: 700; cursor: pointer; }
  .classroom { position: relative; display: grid; grid-template-columns: 1fr 120px; align-items: end; gap: .4rem; padding: 1.1rem 1rem 2.4rem; background: linear-gradient(180deg, #F6EBD9 0, #EFDFC4 78%, #B98B5E 78%, #A87A4E 100%); overflow: hidden; }
  .board { position: relative; z-index: 1; min-height: 250px; padding: 1.1rem 1.3rem 1.6rem; border: 10px solid #8B5E34; border-radius: 10px; background: radial-gradient(ellipse at 30% 20%, #2E5A45, #1D3D2F 70%); box-shadow: inset 0 0 40px rgba(0,0,0,.35), 0 8px 18px rgba(0,0,0,.25); color: #F4F1E8; font-family: 'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive; display: flex; flex-direction: column; justify-content: center; gap: .55rem; }
  .board::after { content: ''; position: absolute; left: 12%; right: 12%; bottom: -16px; height: 6px; background: #6E4826; border-radius: 3px; }
  .b-head { font-size: .85rem; color: #FFE58A; letter-spacing: .5px; text-transform: uppercase; }
  .b-title { font-size: 2rem; font-weight: 700; text-align: center; line-height: 1.2; }
  .b-sub { text-align: center; color: #CFE8DA; font-size: 1.05rem; }
  .b-cols { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; }
  .b-col { border: 2px dashed rgba(244,241,232,.55); border-radius: 10px; padding: .6rem .8rem; font-size: .95rem; line-height: 1.5; }
  .b-col.hl { border-color: #FFE58A; border-style: solid; }
  .b-col-head { font-weight: 700; font-size: 1.15rem; margin-bottom: .2rem; }
  .b-col.hl .b-col-head { color: #FFE58A; }
  .b-calc { font-size: 1.3rem; padding: .25rem .2rem; border-bottom: 2px solid rgba(244,241,232,.18); }
  .b-bar { display: grid; grid-template-columns: 110px 1fr 70px; align-items: center; gap: .6rem; font-size: 1rem; }
  .b-track { height: 22px; border: 2px solid rgba(244,241,232,.5); border-radius: 6px; overflow: hidden; }
  .b-fill { height: 100%; width: var(--w); background: repeating-linear-gradient(45deg, #F4F1E8 0 6px, #D9D3C4 6px 12px); animation: grow 1s both; animation-delay: var(--d); transform-origin: left; }
  .b-fill.c1 { background: repeating-linear-gradient(45deg, #FFE58A 0 6px, #E8C95A 6px 12px); }
  .b-bar strong { text-align: right; }
  .b-rule { font-size: 1.35rem; line-height: 1.45; text-align: center; padding: .8rem; border: 3px solid #FFE58A; border-radius: 14px; color: #FFF6D6; }
  .chalk-in { animation: chalk .7s both; animation-delay: var(--d, 0s); }
  @keyframes chalk { from { clip-path: inset(0 100% 0 0); opacity: .3; } to { clip-path: inset(0 0 0 0); opacity: 1; } }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .teacher { position: relative; z-index: 2; display: flex; justify-content: center; }
  .teacher svg { width: 120px; height: 120px; filter: drop-shadow(0 6px 8px rgba(0,0,0,.25)); animation: float 3s ease-in-out infinite; }
  .teacher.talking svg { animation: talk .45s ease-in-out infinite alternate; }
  @keyframes talk { from { transform: translateY(0) rotate(-2deg); } to { transform: translateY(-4px) rotate(2deg); } }
  .teacher .wand { position: absolute; left: -6px; top: 38px; width: 46px; height: 4px; background: #6E4826; border-radius: 2px; transform-origin: right center; transform: rotate(20deg); transition: transform .4s; }
  .teacher.talking .wand { transform: rotate(-12deg); }
  .students { position: absolute; z-index: 3; left: 0; right: 0; bottom: -14px; display: flex; justify-content: space-around; pointer-events: none; }
  .students span { width: 46px; height: 46px; border-radius: 50% 50% 8px 8px; background: rgba(10,37,64,.85); }
  .students span:nth-child(even) { width: 40px; height: 40px; background: rgba(19,53,92,.85); }
  .caption { position: relative; margin: .9rem 1rem 0; padding: .8rem 1rem; background: #fff; border: 2px solid var(--teal); border-radius: 16px; min-height: 4.2em; font-size: 1rem; line-height: 1.5; }
  .caption::before { content: ''; position: absolute; right: 52px; top: -11px; width: 18px; height: 18px; background: #fff; border-left: 2px solid var(--teal); border-top: 2px solid var(--teal); transform: rotate(45deg); }
  .caption .who { font-size: .7rem; font-weight: 800; text-transform: uppercase; letter-spacing: .9px; color: var(--teal-dark); margin-bottom: .15rem; }
  .controls { display: flex; align-items: center; gap: .45rem; padding: .7rem 1rem; flex-wrap: wrap; }
  .ctl { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--line); background: #fff; font-size: 1rem; cursor: pointer; display: grid; place-items: center; color: var(--navy); }
  .ctl.main { width: 48px; height: 48px; background: var(--navy); color: #fff; border-color: var(--navy); font-size: 1.15rem; }
  .ctl[aria-pressed="true"] { background: var(--teal-soft); border-color: var(--teal-dark); }
  .ctl:disabled { opacity: .4; cursor: default; }
  .segs { flex: 1; display: flex; gap: 4px; min-width: 120px; }
  .seg { flex: 1; height: 8px; border: none; border-radius: 4px; background: var(--line); cursor: pointer; padding: 0; }
  .seg.done { background: var(--teal); }
  .seg.current { background: var(--gold); }
  .hand { margin-left: auto; padding: .5rem .9rem; border-radius: 20px; border: 2px solid var(--navy); background: #fff; color: var(--navy); font: inherit; font-weight: 700; font-size: .85rem; cursor: pointer; }
  .panel { margin: .3rem 1rem 1rem; background: #fff; border-radius: 16px; padding: 1rem; box-shadow: 0 1px 3px rgba(10,37,64,.1); }
  .panel h3 { font-size: .98rem; color: var(--navy); margin-bottom: .2rem; }
  .panel .sub { font-size: .82rem; color: var(--muted); margin-bottom: .7rem; }
  .qa-chips { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: .7rem; }
  .qa-chip { padding: .4rem .8rem; border-radius: 20px; border: 2px solid var(--teal); background: var(--teal-soft); color: var(--navy); font: inherit; font-size: .82rem; font-weight: 600; cursor: pointer; }
  .qa-chip.used { border-color: var(--line); background: #fff; color: var(--muted); }
  .qa-log { display: flex; flex-direction: column; gap: .5rem; margin-bottom: .6rem; }
  .qa-log:empty { display: none; }
  .qa-msg { max-width: 88%; padding: .6rem .85rem; border-radius: 14px; font-size: .9rem; line-height: 1.5; }
  .qa-msg.me { align-self: flex-end; background: var(--navy); color: #fff; border-bottom-right-radius: 4px; }
  .qa-msg.genius { align-self: flex-start; background: var(--gold-soft); border: 2px solid var(--gold); border-bottom-left-radius: 4px; }
  .qa-msg.genius.guard { background: var(--teal-soft); border-color: var(--teal-dark); }
  .qa-msg.wait { color: var(--muted); font-style: italic; }
  .qa-form { display: flex; gap: .5rem; }
  .qa-form input { flex: 1; min-width: 0; border: 2px solid var(--line); border-radius: 22px; padding: .6rem 1rem; font: inherit; font-size: .9rem; }
  .qa-form input:focus { border-color: var(--teal-dark); }
  .check-q { font-weight: 600; margin-bottom: .7rem; line-height: 1.5; }
  .panel .bubble.reaction { margin-top: .7rem; box-shadow: none; }

  /* Esperti */
  .expert-card { background: #fff; border-radius: 18px; overflow: hidden; box-shadow: 0 4px 16px rgba(10,37,64,.12); }
  .expert-top { display: flex; align-items: center; gap: .9rem; padding: 1rem 1.1rem; background: linear-gradient(135deg, var(--navy), var(--navy-2)); color: #fff; position: relative; }
  .expert-top::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: linear-gradient(90deg, var(--teal), var(--gold)); }
  .expert-avatars { display: flex; flex: none; }
  .expert-avatars span { width: 44px; height: 44px; border-radius: 50%; background: #fff; border: 3px solid var(--navy-2); display: grid; place-items: center; font-size: 1.35rem; margin-left: -12px; }
  .expert-avatars span:first-child { margin-left: 0; }
  .expert-title { font-weight: 800; font-size: 1.02rem; }
  .expert-sub { font-size: .8rem; color: #CFE0EE; }
  .expert-topics { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; padding: .8rem 1.1rem 0; font-size: .78rem; font-weight: 700; color: var(--muted); }
  .expert-choices { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; padding: .9rem 1.1rem .4rem; }
  .choice { display: flex; flex-direction: column; align-items: flex-start; gap: .2rem; text-align: left; padding: .9rem; border-radius: 16px; border: 2px solid var(--line); background: #fff; font: inherit; color: var(--navy); cursor: pointer; transition: all .15s; }
  .choice:hover:not(:disabled) { border-color: var(--teal); transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,179,164,.2); }
  .choice .c-ico { width: 42px; height: 42px; border-radius: 12px; background: var(--gold-soft); display: grid; place-items: center; font-size: 1.3rem; margin-bottom: .3rem; }
  .choice:last-child .c-ico { background: var(--teal-soft); }
  .choice strong { font-size: .95rem; }
  .choice small { font-size: .78rem; color: var(--muted); }
  .expert-note { padding: .3rem 1.1rem 0; font-size: .76rem; color: var(--muted); }
  .link-btn { display: block; margin: .3rem 1.1rem 1rem; padding: .3rem 0; background: none; border: none; font: inherit; font-size: .82rem; color: var(--navy-2); text-decoration: underline; cursor: pointer; }
  .locked-card .choice, .locked-card .link-btn { opacity: .45; cursor: default; }

  /* Prenotazione e richiamata */
  .book-card { background: #fff; border-radius: 18px; padding: 1.1rem; box-shadow: 0 4px 16px rgba(10,37,64,.1); display: flex; flex-direction: column; gap: 1rem; }
  .step-label { display: flex; align-items: center; gap: .5rem; font-weight: 800; font-size: .9rem; color: var(--navy); margin-bottom: .5rem; }
  .step-label span { width: 24px; height: 24px; border-radius: 50%; background: var(--navy); color: #fff; display: grid; place-items: center; font-size: .75rem; }
  .pick-row { display: flex; flex-wrap: wrap; gap: .45rem; }
  .pill { padding: .55rem .95rem; border-radius: 22px; border: 2px solid var(--line); background: #fff; font: inherit; font-size: .86rem; font-weight: 600; color: var(--ink); cursor: pointer; transition: all .15s; }
  .pill:hover, .day:hover, .slot:hover:not(:disabled) { border-color: var(--teal); }
  .pill[aria-pressed="true"], .slot[aria-pressed="true"] { background: var(--teal-dark); border-color: var(--teal-dark); color: #fff; }
  .days { display: grid; grid-template-columns: repeat(5, 1fr); gap: .45rem; }
  .day { display: flex; flex-direction: column; align-items: center; padding: .55rem .2rem; border-radius: 14px; border: 2px solid var(--line); background: #fff; font: inherit; color: var(--navy); cursor: pointer; transition: all .15s; }
  .day .dw, .day .dm { font-size: .7rem; font-weight: 700; text-transform: uppercase; color: var(--muted); }
  .day .dn { font-size: 1.35rem; font-weight: 800; line-height: 1.2; }
  .day[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; box-shadow: 0 4px 12px rgba(10,37,64,.25); }
  .day[aria-pressed="true"] .dw, .day[aria-pressed="true"] .dm { color: var(--gold); }
  .slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: .45rem; }
  .slots-empty { grid-column: 1 / -1; font-size: .84rem; color: var(--muted); padding: .4rem 0; }
  .slot { display: flex; flex-direction: column; align-items: center; padding: .5rem; border-radius: 12px; border: 2px solid var(--line); background: #fff; font: inherit; font-weight: 800; color: var(--navy); cursor: pointer; animation: pop .25s ease-out; }
  .slot small { font-size: .66rem; font-weight: 600; color: var(--teal-dark); }
  .slot[aria-pressed="true"] small { color: #fff; }
  .slot:disabled { background: var(--bg); color: #8A99A8; text-decoration: line-through; cursor: not-allowed; }
  .slot:disabled small { color: #8A99A8; text-decoration: none; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
  .fields label span { display: block; font-size: .78rem; font-weight: 700; color: var(--muted); margin-bottom: .25rem; }
  .fields input { width: 100%; border: 2px solid var(--line); border-radius: 12px; padding: .65rem .85rem; font: inherit; font-size: .92rem; }
  .fields input:focus { border-color: var(--teal-dark); }
  .fields input::placeholder, .qa-form input::placeholder { color: #6E7F90; }
  .consent { display: flex; gap: .6rem; align-items: flex-start; font-size: .8rem; line-height: 1.45; color: var(--ink); cursor: pointer; }
  .consent input { flex: none; width: 18px; height: 18px; margin-top: .1rem; accent-color: var(--teal-dark); }
  .consent em { color: var(--muted); font-style: normal; }
  .book-card .answer-foot { margin-top: 0; }

  /* Ticket di conferma */
  .ticket { background: #fff; border-radius: 18px; overflow: hidden; box-shadow: 0 6px 20px rgba(10,37,64,.15); border: 2px solid var(--teal); }
  .ticket-top { display: flex; justify-content: space-between; align-items: center; padding: .7rem 1.1rem; background: var(--teal-soft); color: var(--teal-dark); font-weight: 800; font-size: .9rem; }
  .ticket-top span { font-family: Consolas, monospace; background: #fff; color: var(--navy); padding: .15rem .55rem; border-radius: 8px; border: 1px dashed var(--teal); font-size: .82rem; }
  .ticket-body { display: flex; gap: 1rem; align-items: center; padding: 1rem 1.1rem; border-bottom: 2px dashed var(--line); }
  .cal { flex: none; width: 74px; border-radius: 14px; overflow: hidden; text-align: center; box-shadow: 0 2px 8px rgba(10,37,64,.15); background: #fff; }
  .cal .cm { display: block; background: var(--navy); color: var(--gold); font-size: .72rem; font-weight: 800; text-transform: uppercase; padding: .25rem 0; letter-spacing: 1px; }
  .cal .cd { display: block; font-size: 1.9rem; font-weight: 800; color: var(--navy); line-height: 1.25; }
  .cal .cw { display: block; font-size: .72rem; font-weight: 700; color: var(--muted); text-transform: uppercase; padding-bottom: .3rem; }
  .cal.phone { height: 74px; display: grid; place-items: center; background: var(--gold-soft); }
  .ticket-info { font-size: .87rem; line-height: 1.55; min-width: 0; }
  .t-time { font-size: 1.15rem; font-weight: 800; color: var(--navy); }
  .t-who, .t-topics { font-size: .8rem; color: var(--muted); overflow-wrap: anywhere; }
  .ticket-foot { display: flex; align-items: center; justify-content: space-between; gap: .7rem; flex-wrap: wrap; padding: .2rem 1.1rem .9rem; font-size: .74rem; color: var(--muted); }
  .ticket-foot .cta.small { margin-top: .7rem; }
  @media (max-width: 560px) {
    .expert-choices, .fields { grid-template-columns: 1fr; }
    .days { gap: .3rem; }
    .day .dn { font-size: 1.1rem; }
  }

  /* Accessibilità */
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--teal-dark); outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (max-width: 560px) {
    .classroom { grid-template-columns: 1fr 76px; padding: .8rem .6rem 2.2rem; }
    .teacher svg { width: 76px; height: 76px; }
    .teacher .wand { display: none; }
    .board { min-height: 220px; padding: .8rem; border-width: 7px; }
    .b-title { font-size: 1.5rem; }
    .b-calc, .b-rule { font-size: 1.05rem; }
    .b-cols { grid-template-columns: 1fr; }
    .b-bar { grid-template-columns: 80px 1fr 56px; font-size: .9rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <svg class="logo" viewBox="0 0 64 64" aria-label="FinGenius 360">
      <path d="M50 47 C57 42 52 37 45 40 C39 43 35 46 32 41" fill="none" stroke="#7FE0D7" stroke-width="5" stroke-linecap="round"/>
      <path d="M22 36 C22 28 42 28 42 36 C42 40 37 42 32 42 C27 42 22 40 22 36Z" fill="#00B3A4"/>
      <path d="M24.5 35 Q32 39 39.5 35" stroke="#008C80" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="32" cy="21" r="9" fill="#3CCFC2"/>
      <path d="M22 18.5 C22 8 42 8 42 18.5 C38 15.5 26 15.5 22 18.5Z" fill="#0A2540"/>
      <circle cx="32" cy="9.5" r="1.8" fill="#0A2540"/>
      <circle cx="32" cy="13.5" r="2.2" fill="#F5B700"/>
      <circle cx="28.5" cy="21" r="1.3" fill="#0A2540"/>
      <circle cx="35.5" cy="21" r="1.3" fill="#0A2540"/>
      <path d="M28.5 25 Q32 28 35.5 25" stroke="#0A2540" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <path d="M30.6 29 L32 33 L33.4 29Z" fill="#0A2540"/>
      <path d="M38 51 L50 45.5 Q52.5 45 51 47.5 L41 54Z" fill="#F5B700"/>
      <path d="M14 50.5 c-5 0 -5 5.5 0 5.5" stroke="#D99E00" stroke-width="2" fill="none"/>
      <path d="M14 54 H40 C40 49 34 46 27 46 S14 49 14 54Z" fill="#F5B700"/>
      <rect x="17" y="54" width="20" height="3" rx="1.5" fill="#D99E00"/>
    </svg>
    <div class="brand">
      <div class="name">FinGenius <span>360</span></div>
      <div class="status">Genius · il tuo coach finanziario</div>
    </div>
    <div class="progress" id="progress">
      <div class="phase" id="phase"></div>
      <div class="dots" id="dots"><span></span><span></span><span></span><span></span><span></span></div>
    </div>
  </header>

  <main class="view active" id="chat"><div class="chat-inner" id="chat-inner"></div></main>

  <section class="view stage" id="stage">
    <div class="scene-banner">
      <div class="scene-icon" id="scene-icon"></div>
      <div>
        <div class="scene-kicker" id="scene-kicker"></div>
        <div class="scene-title" id="scene-title"></div>
      </div>
    </div>
    <div class="stage-body" id="stage-body"></div>
  </section>

  <section class="view lesson-view" id="lesson" aria-label="Aula di Genius"></section>
</div>

<script>
// ─── Contenuti ────────────────────────────────────────────────────────────────

const CLUSTERS = [
  { id: 'busta',    icon: '💼', name: 'Busta paga',               desc: 'Lordo, netto, contributi e TFR',             active: false },
  { id: 'prestiti', icon: '💳', name: 'Prestiti & Finanziamenti', desc: 'TAEG, rate, tasso zero, carte revolving',    active: true  },
  { id: 'bollette', icon: '💡', name: 'Bollette & Abbonamenti',   desc: 'Costi fissi, variabili e rinnovi automatici', active: false },
  { id: 'budget',   icon: '📊', name: 'Budget personale',         desc: 'Entrate, uscite e fondo per gli imprevisti', active: false },
  { id: 'conto',    icon: '🏦', name: 'Conto corrente',           desc: 'Estratto conto, commissioni e interessi',    active: false }
];

// Situazioni e lezioni arrivano da data/prestiti.json (file condiviso con il server)
let DATA = null;
let QUESTIONS = [];

const CONCEPT_NAMES = {
  taeg_vs_tan: 'TAEG vs TAN', rata_costo_totale: 'Rata vs costo totale',
  tasso_zero: 'Tasso zero', anticipo: 'Anticipo', revolving: 'Rata minima revolving'
};

const LETTERS = ['A', 'B', 'C'];

// ─── Stato e riferimenti ──────────────────────────────────────────────────────

const state = { preAnswers: [], preMotivations: [], postAnswers: [], result: null, checks: [] };

const views = { chat: document.getElementById('chat'), stage: document.getElementById('stage'), lesson: document.getElementById('lesson') };
const containers = { chat: document.getElementById('chat-inner'), stage: document.getElementById('stage-body') };
let current = 'chat';
const AVATAR = document.querySelector('.topbar .logo').outerHTML.replace(/class="logo" aria-label="[^"]*"/, 'aria-hidden="true" focusable="false"');

// ─── Helper ───────────────────────────────────────────────────────────────────

const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; };
const isDontKnow = m => /non\s*lo\s*so/i.test(m || '');
const scrollDown = () => requestAnimationFrame(() => { if (current !== 'lesson') views[current].scrollTop = views[current].scrollHeight; });

function useView(name) {
  current = name;
  Object.entries(views).forEach(([k, v]) => v.classList.toggle('active', k === name));
  scrollDown();
}

function addRow(who, inner, wide = false) {
  const row = document.createElement('div');
  row.className = `row ${who}${wide ? ' wide' : ''}`;
  row.innerHTML = who === 'bot'
    ? `<div class="avatar">${AVATAR}</div><div class="stack">${inner}</div>`
    : `<div class="stack">${inner}</div>`;
  (containers[current] || containers.chat).appendChild(row);
  scrollDown();
  return row;
}

function addTyping() {
  const row = addRow('bot', '<div class="bubble typing"><span></span><span></span><span></span></div>');
  row.querySelector('.avatar').classList.add('thinking');
  return row;
}

async function botSay(html, { cls = '', delay = 750, wide = false } = {}) {
  const typing = addTyping();
  await sleep(delay);
  typing.remove();
  return addRow('bot', `<div class="bubble ${cls}">${html}</div>`, wide);
}

async function botBlock(html, delay = 600) {
  const typing = addTyping();
  await sleep(delay);
  typing.remove();
  return addRow('bot', html, true);
}

const userSay = html => addRow('user', `<div class="bubble">${html}</div>`);

async function ctaButton(label, echo = true) {
  const row = addRow('bot', `<div><button class="cta">${label}</button></div>`);
  await new Promise(res => row.querySelector('button').onclick = res);
  row.remove();
  if (echo) userSay(esc(label.replace(/\s*→$/, '')));
}

function setProgress(index, phase) {
  document.getElementById('progress').classList.add('visible');
  document.getElementById('phase').textContent = phase;
  document.querySelectorAll('#dots span').forEach((d, i) => {
    d.className = i < index ? 'done' : i === index ? 'current' : '';
  });
}

function setScene(icon, kicker, title) {
  document.getElementById('scene-icon').textContent = icon;
  document.getElementById('scene-kicker').textContent = kicker;
  document.getElementById('scene-title').textContent = title;
  containers.stage.innerHTML = '';
  views.stage.scrollTop = 0;
  views.stage.classList.remove('stage-enter');
  void views.stage.offsetWidth;
  views.stage.classList.add('stage-enter');
}

function optionsHtml(options) {
  return `<div class="options">${options.map((o, i) =>
    `<button class="opt" data-i="${i}"><span class="letter">${LETTERS[i]}</span><span>${o}</span></button>`
  ).join('')}</div>`;
}

const pickHtml = (q, choice) => `<div class="pick"><span class="pick-letter">${LETTERS[choice]}</span>${esc(q.options[choice])}</div>`;

// ─── Flusso ───────────────────────────────────────────────────────────────────

async function loadData() {
  try {
    const resp = await fetch('data/prestiti.json');
    if (!resp.ok) throw new Error(resp.status);
    DATA = await resp.json();
    QUESTIONS = DATA.questions;
    Object.entries(DATA.lessons).forEach(([c, l]) => l.concept = c);
  } catch {
    await botSay('Ops, non riesco a caricare i contenuti 😕 Controlla che il server sia avviato e ricarica la pagina.', { delay: 300 });
    throw new Error('dati non disponibili');
  }
}

async function start() {
  await loadData();
  await botSay('Ciao! 👋 Sono <strong>Genius</strong>, il tuo coach di FinGenius 360.', { delay: 500 });
  await botSay('Niente lezioni noiose: ti porto dentro situazioni di tutti i giorni e capiamo insieme come funzionano davvero i soldi.');
  await botSay('Da quale area vuoi partire?');
  await chooseCluster();
  await intro();
  await preQuiz();
  useView('chat');
  await analyze();
}

async function chooseCluster() {
  const row = await botBlock(`<div class="clusters">${CLUSTERS.map(c => `
    <button class="cluster ${c.active ? 'active' : 'soon'}" data-id="${c.id}">
      <span class="tag">${c.active ? 'Disponibile' : '🔒 Presto'}</span>
      <div class="ico">${c.icon}</div>
      <div class="cname">${c.name}</div>
      <div class="cdesc">${c.desc}</div>
    </button>`).join('')}</div>`);

  const grid = row.querySelector('.clusters');
  const chosen = await new Promise(resolve => {
    grid.querySelectorAll('.cluster').forEach(btn => btn.onclick = async () => {
      const c = CLUSTERS.find(x => x.id === btn.dataset.id);
      if (c.active) { btn.classList.add('chosen'); resolve(c); return; }
      if (grid.dataset.busy) return;
      grid.dataset.busy = '1';
      await botSay(`Il percorso <strong>${c.name}</strong> è in arrivo 🚧 Per ora puoi provare <strong>Prestiti & Finanziamenti</strong>.`, { delay: 500 });
      delete grid.dataset.busy;
    });
  });
  grid.classList.add('locked');
  userSay(`${chosen.icon} ${chosen.name}`);
}

async function intro() {
  await botSay('Ottima scelta! Prestiti e rate sono ovunque: telefono, auto, cucina… e i costi veri spesso si nascondono nei dettagli. 🔍');
  await botSay('Ti porto dentro <strong>5 situazioni</strong>. In ognuna scegli la risposta e mi spieghi <strong>perché</strong>: io ti dirò cosa ne penso.');
  await botSay('Se non sai rispondere, scrivi <strong>"NON LO SO"</strong>: non è un errore, anzi mi aiuta a capire cosa spiegarti. 😉');
  await ctaButton('Sono pronto, iniziamo →');
  await sleep(400);
}

async function preQuiz() {
  useView('stage');
  for (let i = 0; i < QUESTIONS.length; i++) {
    const { choice, motivation } = await askQuestion(i);
    state.preAnswers[i] = choice;
    state.preMotivations[i] = motivation;
  }
  setProgress(5, 'Round 1 completato');
  setScene('🏁', 'Round 1 completato', 'Ottimo lavoro!');
  await botSay('Hai affrontato tutte e 5 le situazioni 🎉 Ora metto insieme il quadro completo e ti preparo qualcosa su misura.', { delay: 600 });
  await ctaButton('Vedi la mia analisi →', false);
}

async function askQuestion(i) {
  const q = QUESTIONS[i];
  setProgress(i, `Round 1 · Situazione ${i + 1}/5`);
  setScene(q.icon, `Situazione ${i + 1} di 5`, q.chapter);

  for (const [k, line] of q.story.entries()) await botSay(line, { cls: k === 0 ? 'scene' : '', delay: k === 0 ? 700 : 1100 });
  await botSay(`<div class="q-label">❓ La domanda</div>${q.question}`, { cls: 'question', delay: 800 });

  const optRow = addRow('bot', optionsHtml(q.options), true);
  const ansRow = addRow('bot', `<div class="answer-card">
      <label for="mot">Perché hai scelto questa risposta? <span class="req">obbligatorio</span></label>
      <textarea id="mot" rows="2" placeholder='Scrivi il tuo ragionamento. Se non sai rispondere scrivi "NON LO SO"'></textarea>
      <div class="answer-foot"><span class="hint"></span><button class="cta" disabled>Rispondi a Genius ➤</button></div>
    </div>`, true);

  const ta = ansRow.querySelector('textarea');
  const btn = ansRow.querySelector('.cta');
  const hint = ansRow.querySelector('.hint');
  let selected = null;

  const refresh = () => {
    const hasText = ta.value.trim().length > 0;
    btn.disabled = !(selected !== null && hasText);
    hint.textContent = selected === null ? '👆 Prima scegli una risposta' : hasText ? '✅ Premi Invio o il pulsante' : '✍️ Ora spiegami il perché';
  };

  optRow.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    if (optRow.classList.contains('locked')) return;
    selected = Number(b.dataset.i);
    optRow.querySelectorAll('.opt').forEach(x => x.classList.toggle('selected', x === b));
    refresh();
    ta.focus();
  });
  ta.addEventListener('input', () => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; refresh(); });
  refresh();

  const motivation = await new Promise(res => {
    const send = () => { if (!btn.disabled) res(ta.value.trim()); };
    btn.onclick = send;
    ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
  });

  optRow.classList.add('locked');
  ansRow.remove();
  userSay(`${pickHtml(q, selected)}<div class="why">${esc(motivation)}</div>`);

  await react(i, selected, motivation);
  await ctaButton(i < QUESTIONS.length - 1 ? 'Prossima situazione →' : 'Concludi il round →', false);
  return { choice: selected, motivation };
}

async function react(i, answer, motivation) {
  const typing = addTyping();
  let text;
  try {
    const [resp] = await Promise.all([
      fetch('/api/react', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question_index: i, answer, motivation })
      }),
      sleep(1200)
    ]);
    if (!resp.ok) throw new Error(resp.status);
    text = (await resp.json()).reaction;
  } catch {
    text = 'Ci sto ancora pensando… ne parliamo alla fine del round! 🧞';
  }
  typing.remove();
  addRow('bot', `<div class="bubble reaction"><div class="q-label">🧞 Genius ci pensa su</div>${esc(text)}</div>`);
}

async function analyze() {
  await botSay('Ora analizzo le tue risposte e soprattutto <strong>il tuo ragionamento</strong>. Un attimo… 🧠');

  const card = addRow('bot', `<div class="agent-card">
      <div class="agent-title">⚙️ Genius sta lavorando</div>
      <div class="agent-step"><span class="dot"></span><code>score_quiz</code> Punteggio e risposte indovinate</div>

async function classroom(lessons) {
  const n = lessons.length;
  const plural = n > 1 ? 'i' : 'e';
  await botSay(`Ho preparato <strong>${n} lezion${plural} in aula</strong>, solo sui punti da rafforzare. Io spiego alla lavagna; tu puoi fermarmi quando vuoi e farmi tutte le domande che ti vengono. 🎓`);
  const row = await botBlock(`<div class="playlist">
      <div class="lesson-top">🎓 L'aula di Genius · ${n} lezion${plural}</div>
      ${lessons.map((l, k) => `<div class="pl-item">
        <span class="pl-num">${k + 1}</span>
        <div><div class="pl-title">${esc(l.title)}</div><div class="pl-meta">${l.scenes.length} scene alla lavagna · domande libere · verifica finale</div></div>
        <span class="pl-status">Da vedere</span>

    </div>`, 900);
  const items = row.querySelectorAll('.pl-item');

  for (const [k, l] of lessons.entries()) {
    items[k].classList.add('next');
    btn.textContent = k === 0 ? '▶ Entra in aula' : `▶ Lezione ${k + 1}: torna in aula`;
    await new Promise(res => btn.onclick = res);
    setProgress(k, `Aula · Lezione ${k + 1}/${n}`);
    const outcome = await openLesson(l, k, n);

    useView('chat');

    items[k].querySelector('.pl-status').textContent = outcome.skipped ? 'Saltata' : '✓ Completata';

  const asked = state.checks.reduce((s, c) => s + c.questions, 0);
  if (asked) await botSay(`In aula mi hai fatto <strong>${asked} domand${asked > 1 ? 'e' : 'a'}</strong>: è così che si impara davvero. 🙌`);

function boardHtml(b) {
  const d = i => `style="--d:${(i * 0.5).toFixed(1)}s"`;
  const head = b.title ? `<div class="b-head chalk-in">${esc(b.title)}</div>` : '';
  const calcRows = (rows, from) => (rows || []).map((r, i) => `<div class="b-calc chalk-in" ${d(from + i)}>${esc(r.show)}</div>`).join('');
  switch (b.type) {
    case 'title':
      return `<div class="b-title chalk-in">${esc(b.text)}</div><div class="b-sub chalk-in" ${d(1)}>${esc(b.sub || '')}</div>`;
    case 'compare':
      return head + `<div class="b-cols">${b.cols.map((c, i) => `<div class="b-col chalk-in${c.hl ? ' hl' : ''}" ${d(i + 1)}>
          <div class="b-col-head">${esc(c.head)}</div>${c.lines.map(x => `<div>${esc(x)}</div>`).join('')}</div>`).join('')}</div>`;
    case 'calc':
      return head + calcRows(b.rows, 1);
    case 'bars': {
      const max = b.max || Math.max(...b.items.map(x => x.value));
      return head + b.items.map((x, i) => `<div class="b-bar chalk-in" ${d(i + 1)}>
          <span>${esc(x.label)}</span>
          <div class="b-track"><div class="b-fill c${i}" style="--w:${(x.value / max * 100).toFixed(1)}%;--d:${(i * 0.5 + 0.8).toFixed(1)}s"></div></div>
          <strong>${esc(b.unit || '')}${x.value.toLocaleString('it-IT')}</strong></div>`).join('') + calcRows(b.rows, b.items.length + 1);
    }
    case 'rule':
      return head + `<div class="b-rule chalk-in">★ ${esc(b.text)}</div>`;
  }
  return '';
}

function openLesson(lesson, k, n) {
  return new Promise(resolve => {
    const el = views.lesson;
    const scenes = lesson.scenes;
    const last = scenes.length - 1;
    const canSpeak = 'speechSynthesis' in window;

    el.innerHTML = `
      <div class="class-head">
        <div><div class="scene-kicker">🎓 Aula di Genius · Lezione ${k + 1} di ${n}</div><h2>${esc(lesson.title)}</h2></div>
        <button class="exit" data-act="exit">Esci dall'aula ✕</button>
      </div>
      <div class="classroom">
        <div class="board" id="board"></div>
        <div class="teacher" id="teacher" aria-hidden="true"><span class="wand"></span>${AVATAR}</div>
        <div class="students" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
      </div>
      <div class="caption" aria-live="polite"><div class="who">🧞 Genius</div><div id="cap"></div></div>
      <div class="controls">
        <button class="ctl" data-act="prev" aria-label="Scena precedente">⏮</button>
        <button class="ctl main" data-act="play" aria-label="Pausa">⏸</button>
        <button class="ctl" data-act="next" aria-label="Scena successiva">⏭</button>
        <button class="ctl" data-act="replay" aria-label="Ricomincia la lezione">↺</button>
        ${canSpeak ? '<button class="ctl" data-act="voice" aria-pressed="false" aria-label="Voce di Genius">🔈</button>' : ''}
        <div class="segs">${scenes.map((_, i) => `<button class="seg" data-seg="${i}" aria-label="Vai alla scena ${i + 1}"></button>`).join('')}</div>
        <button class="hand" data-act="hand">🙋 Alza la mano</button>
      </div>
      <div class="panel" id="qa">
        <h3>🙋 Chiedi a Genius</h3>
        <p class="sub">Interrompimi quando vuoi: scegli una domanda o scrivi la tua. Ti spiego i concetti, ma non ti dirò mai cosa scegliere.</p>
        <div class="qa-chips">${lesson.faq.map((f, i) => `<button class="qa-chip" data-faq="${i}">${esc(f.q)}</button>`).join('')}</div>
        <div class="qa-log" id="qa-log" aria-live="polite"></div>
        <form class="qa-form" id="qa-form">
          <label class="sr-only" for="qa-input">La tua domanda a Genius</label>
          <input id="qa-input" maxlength="500" autocomplete="off" placeholder="Scrivi la tua domanda a Genius…">
          <button class="cta small" style="margin:0">Chiedi ➤</button>
        </form>
      </div>
      <div class="panel" id="verify" hidden></div>`;

    const $ = s => el.querySelector(s);
    const teacher = $('#teacher');
    const playBtn = $('[data-act="play"]');
    let idx = 0, playing = true, voice = false, finished = false, timer = null, safety = null, token = 0, questions = 0, result = null;

    const stopVoice = () => { if (canSpeak) speechSynthesis.cancel(); };
    const utter = text => {
      const u = new SpeechSynthesisUtterance(text.replace(/\p{Extended_Pictographic}/gu, ''));
      u.lang = 'it-IT';
      const it = speechSynthesis.getVoices().find(v => v.lang.startsWith('it'));
      if (it) u.voice = it;
      return u;
    };

    function render() {
      const s = scenes[idx];
      $('#board').innerHTML = boardHtml(s.board);
      $('#cap').textContent = s.say;
      el.querySelectorAll('.seg').forEach((g, i) => g.className = 'seg' + (i < idx ? ' done' : i === idx ? ' current' : ''));
      $('[data-act="prev"]').disabled = idx === 0;
      schedule();
    }

    function schedule() {
      clearTimeout(timer); clearTimeout(safety); stopVoice();
      const my = ++token;
      playBtn.textContent = playing ? '⏸' : '▶';
      playBtn.setAttribute('aria-label', playing ? 'Pausa' : 'Riprendi');
      teacher.classList.toggle('talking', playing);
      if (!playing) return;
      const advance = () => {
        if (my !== token) return;
        clearTimeout(timer); clearTimeout(safety);
        if (idx < last) { idx++; render(); } else finish();
      };
      const say = scenes[idx].say;
      if (voice) {
        const u = utter(say);
        u.onend = () => { if (my === token) timer = setTimeout(advance, 700); };
        speechSynthesis.speak(u);
        safety = setTimeout(advance, say.length * 110 + 4000);
      } else {
        timer = setTimeout(advance, Math.max(4500, say.length * 65));
      }
    }

    function finish() {
      playing = false;
      schedule();
      el.querySelectorAll('.seg').forEach(g => g.className = 'seg done');
      $('#cap').textContent = 'Fine della lezione! Hai qualche dubbio? Chiedimi pure qui sotto, poi passiamo alla domanda di verifica.';
      if (finished) return;
      finished = true;
      const v = $('#verify');
      v.hidden = false;
      v.innerHTML = `<h3>✍️ Domanda di verifica</h3><p class="sub">Numeri nuovi, stesso ragionamento.</p>
        <button class="cta small" data-act="start-check" style="margin-top:0">Sono pronto →</button>`;
    }

    function startCheck() {
      const c = lesson.check;
      const v = $('#verify');
      v.innerHTML = `<h3>✍️ Domanda di verifica</h3><p class="check-q">${esc(c.question)}</p>${optionsHtml(c.options.map(esc))}`;
      const box = v.querySelector('.options');
      box.querySelectorAll('.opt').forEach(b => b.onclick = () => {
        if (box.classList.contains('locked')) return;
        box.classList.add('locked');
        b.classList.add('selected');
        const choice = Number(b.dataset.i);
        result = { skipped: false, correct: choice === c.correct };
        v.insertAdjacentHTML('beforeend', `<div class="bubble reaction" role="status"><div class="q-label">🧞 Genius ci pensa su</div>${esc(c.reactions[choice])}</div>
          <button class="cta small" data-act="done">Torna al percorso →</button>`);
        v.querySelector('[data-act="done"]').focus();
      });
      box.querySelector('.opt').focus();
    }

    async function ask(text) {
      const q = text.trim();
      if (!q) return;
      playing = false;
      schedule();
      questions++;
      const log = $('#qa-log');
      log.insertAdjacentHTML('beforeend', `<div class="qa-msg me">${esc(q)}</div>`);
      const reply = document.createElement('div');
      reply.className = 'qa-msg genius wait';
      reply.textContent = 'Genius ci pensa…';
      log.appendChild(reply);
      reply.scrollIntoView({ block: 'nearest' });
      teacher.classList.add('talking');
      let answer = 'Non riesco a risponderti adesso 😕 Riprova tra un attimo.', guarded = false;
      try {
        const [resp] = await Promise.all([
          fetch('/api/ask', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ concept: lesson.concept, question: q.slice(0, 500) }) }),
          sleep(800)
        ]);
        if (resp.ok) ({ answer, guarded = false } = await resp.json());
      } catch {}
      if (!el.contains(reply)) return;
      reply.className = `qa-msg genius${guarded ? ' guard' : ''}`;
      reply.textContent = answer;
      reply.scrollIntoView({ block: 'nearest' });
      if (voice) { stopVoice(); const u = utter(answer); u.onend = () => teacher.classList.remove('talking'); speechSynthesis.speak(u); }
      else setTimeout(() => teacher.classList.remove('talking'), 1500);
    }

    function close(outcome) {
      token++;
      clearTimeout(timer); clearTimeout(safety); stopVoice();
      document.removeEventListener('keydown', onKey);
      el.onclick = null;
      el.innerHTML = '';
      resolve({ skipped: false, correct: null, ...outcome, questions });
    }

    el.onclick = e => {
      const t = e.target.closest('[data-act], [data-seg], [data-faq]');
      if (!t) return;
      if (t.dataset.seg !== undefined) { idx = Number(t.dataset.seg); playing = true; render(); return; }
      if (t.dataset.faq !== undefined) { t.classList.add('used'); ask(lesson.faq[Number(t.dataset.faq)].q); return; }
      switch (t.dataset.act) {
        case 'play':
          if (!playing && finished && idx === last) { idx = 0; playing = true; render(); }
          else { playing = !playing; schedule(); }
          break;
        case 'prev': idx = Math.max(0, idx - 1); playing = true; render(); break;
        case 'next': if (idx < last) { idx++; playing = true; render(); } else finish(); break;
        case 'replay': idx = 0; playing = true; render(); break;
        case 'voice':
          voice = !voice;
          t.setAttribute('aria-pressed', String(voice));
          t.textContent = voice ? '🔊' : '🔈';
          schedule();
          break;
        case 'hand':
          playing = false;
          schedule();
          $('#qa').scrollIntoView({ behavior: 'smooth', block: 'start' });
          $('#qa-input').focus({ preventScroll: true });
          break;
        case 'start-check': startCheck(); break;
        case 'done': close(result); break;
        case 'exit': close(result || { skipped: true }); break;
      }
    };

    $('#qa-form').onsubmit = e => {
      e.preventDefault();
      const input = $('#qa-input');
      ask(input.value);
      input.value = '';
    };

    const onKey = e => {
      if (current !== 'lesson' || e.target.closest('input, textarea, button')) return;
      if (e.key === ' ') { e.preventDefault(); playBtn.click(); }
      else if (e.key === 'ArrowRight') $('[data-act="next"]').click();
      else if (e.key === 'ArrowLeft' && idx > 0) $('[data-act="prev"]').click();
    };
    document.addEventListener('keydown', onKey);

    useView('lesson');
    el.scrollTop = 0;
    render();
    playBtn.focus({ preventScroll: true });
  });
}

async function showImprovement() {
  const preScore = state.result.score;
  const postScore = state.postAnswers.filter((a, i) => a === DATA.round2[i].correct).length;
  const stillWeak = DATA.round2.filter((q, i) => state.postAnswers[i] !== q.correct).map(q => q.concept);
  const pre = Math.round(preScore / 5 * 100);
  const post = Math.round(postScore / 5 * 100);
  const delta = post - pre;
  const dontKnowCount = state.preMotivations.filter(isDontKnow).length;

  const [kind, big, text] = delta > 0
    ? ['up', `+${delta}%`, 'di comprensione in una sola sessione 🚀']
    : delta === 0
    ? ['same', `${post}%`, 'punteggio confermato: le tue basi sono solide']
    : ['down', `${delta}%`, 'qualche dubbio resta: rileggi le micro-lezioni e riprova'];

  const learned = state.result.lessons.map(l => CONCEPT_NAMES[l.concept] || l.concept);

  await botSay('Ecco il momento della verità… 🥁', { delay: 700 });
  const row = await botBlock(`<div class="final">
      <h3>📈 Il tuo progresso</h3>
      <div class="bar-row"><span>Prima</span><div class="track"><div class="fill before" data-w="${pre}"></div></div><span>${pre}%</span></div>
      <div class="bar-row"><span>Dopo</span><div class="track"><div class="fill after" data-w="${post}"></div></div><span>${post}%</span></div>
      <div class="delta ${kind}"><span class="big">${big}</span>${text}</div>
      ${dontKnowCount ? `<p style="font-size:.85rem;margin-bottom:.6rem">All'inizio avevi risposto <strong>"NON LO SO"</strong> ${dontKnowCount} ${dontKnowCount > 1 ? 'volte' : 'volta'}: ora ${post === 100 ? 'hai risposto correttamente a tutto' : 'hai qualche strumento in più'}.</p>` : ''}
      ${learned.length ? `<div style="font-size:.8rem;font-weight:700;color:var(--muted)">CONCETTI CHE HAI STUDIATO OGGI</div><div class="chips">${learned.map(c => `<span class="chip">${c}</span>`).join('')}</div>` : ''}
      <p class="disclaimer">FinGenius 360 è uno strumento educativo: non fornisce consulenza finanziaria né indica cosa scegliere. Per decisioni importanti rivolgiti a un professionista abilitato.</p>
      <div style="margin-top:1rem"><button class="cta" onclick="location.reload()">↺ Ricomincia</button></div>
    </div>`, 1200);

  setTimeout(() => row.querySelectorAll('.fill').forEach(f => f.style.width = f.dataset.w + '%'), 100);

  if (postScore < EXPERT_THRESHOLD) {
    await sleep(1600);
    await expertOffer(stillWeak);
  }
}

function nextWorkingDays(count) {
  const days = [];
  const d = new Date();
  while (days.length < count) {
    d.setDate(d.getDate() + 1);
    if (d.getDay() !== 0 && d.getDay() !== 6) days.push(new Date(d));
  }
  return days;
}

      <p class="expert-note">È un momento di formazione: nessuna vendita di prodotti finanziari.</p>
      <button class="link-btn" data-c="no">No grazie, per ora va bene così</button>
    </div>`, 900);

  const choice = await new Promise(res => card.querySelectorAll('[data-c]').forEach(b => b.onclick = () => res(b.dataset.c)));
  card.querySelector('.expert-card').classList.add('locked-card');
  card.querySelectorAll('button').forEach(b => b.disabled = true);

  if (choice === 'no') {
    userSay('No grazie, per ora va bene così');
    await botSay('Nessun problema! 😊 Puoi sempre ricominciare il percorso e ripassare in aula quando vuoi.');
    return;
  }
  userSay(choice === 'appointment' ? '📅 Fissa un appuntamento' : '📞 Richiamami');
  return choice === 'appointment' ? bookAppointment(topics) : requestCallback(topics);
}

function consentHtml() {
  return `<label class="consent"><input type="checkbox" data-f="consent">
    <span>Acconsento all'uso dei miei dati solo per organizzare questa sessione. <em>Demo: i dati restano in memoria sul server e non vengono inviati a nessuno.</em></span></label>`;
}

async function submitContact(payload) {
  const resp = await fetch('/api/contact', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
  if (!resp.ok) throw new Error(resp.status);
  return (await resp.json()).code;
}

async function contactForm(html, init, readPayload, isComplete) {
  const row = await botBlock(html, 700);
  const form = row.querySelector('.book-card');
  valueOf.form = form;
  init(form);
  const btn = form.querySelector('.cta');
  const hint = form.querySelector('.hint');
  const refresh = () => { const missing = isComplete(form); btn.disabled = !!missing; hint.textContent = missing || '✅ Tutto pronto'; };
  form.addEventListener('input', refresh);
  form.addEventListener('click', () => setTimeout(refresh));
  refresh();

  while (true) {
    await new Promise(res => btn.onclick = res);
    btn.disabled = true;
    btn.textContent = 'Invio in corso…';
    const payload = readPayload(form);
    try {
      const code = await submitContact(payload);
      row.remove();
      return { payload, code };
    } catch {
      hint.textContent = '⚠️ Non sono riuscito a inviare la richiesta: controlla i dati e riprova.';
      btn.textContent = 'Riprova';
      btn.disabled = false;
    }
  }
}

async function bookAppointment(topics) {
  const days = nextWorkingDays(5);
  const sel = { mode: null, day: null, slot: null };
  const busy = (d, s) => (d * 2 + s) % 5 === 1;

  await botSay('Perfetto! Scegli come, quando e a che ora: ci vuole meno di un minuto. ⏱️');
  const { payload, code } = await contactForm(`<div class="book-card">
      <div class="book-step"><div class="step-label"><span>1</span>Come preferisci incontrarci?</div>
        <div class="pick-row" data-g="mode">${Object.entries(MODES).map(([v, l]) => `<button class="pill" data-v="${v}" aria-pressed="false">${l}</button>`).join('')}</div></div>
      <div class="book-step"><div class="step-label"><span>2</span>Scegli il giorno</div>
        <div class="days" data-g="day">${days.map((d, i) => `<button class="day" data-v="${isoDay(d)}" data-i="${i}" aria-pressed="false" aria-label="${WEEKDAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}">
          <span class="dw">${WEEKDAYS[d.getDay()]}</span><span class="dn">${d.getDate()}</span><span class="dm">${MONTHS[d.getMonth()]}</span></button>`).join('')}</div></div>
      <div class="book-step"><div class="step-label"><span>3</span>Scegli l'orario</div>
        <div class="slots" data-g="slot"><p class="slots-empty">👆 Prima scegli un giorno</p></div></div>
      <div class="book-step"><div class="step-label"><span>4</span>I tuoi dati</div>
        <div class="fields">
          <label><span>Nome</span><input data-f="name" maxlength="80" autocomplete="given-name" placeholder="Come ti chiami?"></label>
          <label><span>Email</span><input data-f="email" type="email" maxlength="120" autocomplete="email" placeholder="nome@esempio.it"></label>
        </div></div>
      ${consentHtml()}
      <div class="answer-foot"><span class="hint"></span><button class="cta" disabled>Conferma appuntamento ✓</button></div>
    </div>`,
    setupBooking,
    () => ({ type: 'appointment', topics, ...sel, name: valueOf('name'), email: valueOf('email'), consent: true }),
    form => {
      if (!sel.mode) return '👆 Scegli la modalità';
      if (!sel.day) return '📅 Scegli un giorno';
      if (!sel.slot) return '🕐 Scegli un orario';
      if (valueOf('name').length < 2) return '✍️ Scrivi il tuo nome';
      if (!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(valueOf('email'))) return '✉️ Inserisci un\'email valida';
      if (!form.querySelector('[data-f="consent"]').checked) return '☑️ Serve il consenso per procedere';
      return '';
    });

  function setupBooking(form) {
    pickGroup(form.querySelector('[data-g="mode"]'), v => sel.mode = v);
    pickGroup(form.querySelector('[data-g="day"]'), v => {
      sel.day = v;
      sel.slot = null;
      const d = Number(form.querySelector(`.day[data-v="${v}"]`).dataset.i);
      const box = form.querySelector('[data-g="slot"]');
      box.innerHTML = SLOTS.map((s, i) => busy(d, i)
        ? `<button class="slot" disabled aria-label="${s} non disponibile">${s}<small>occupato</small></button>`
        : `<button class="slot" data-v="${s}" aria-pressed="false">${s}<small>libero</small></button>`).join('');
      pickGroup(box, s => sel.slot = s);
    });
  }

  const d = new Date(payload.day + 'T12:00:00');
  userSay(`${MODES[payload.mode]} · ${WEEKDAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]} alle ${payload.slot}`);
  await botSay('Fatto! 🎉 Il tuo appuntamento è confermato. Ecco il promemoria:');
  const ticket = await botBlock(`<div class="ticket">
      <div class="ticket-top">✅ Appuntamento confermato <span>${esc(code)}</span></div>
      <div class="ticket-body">
        <div class="cal" aria-hidden="true"><span class="cm">${MONTHS[d.getMonth()]}</span><span class="cd">${d.getDate()}</span><span class="cw">${WEEKDAYS[d.getDay()]}</span></div>
        <div class="ticket-info">
          <div class="t-time">${payload.slot} · 30 minuti</div>
          <div>${MODES[payload.mode]} con un esperto FinGenius</div>
          <div class="t-who">Intestato a ${esc(payload.name)} · ${esc(payload.email)}</div>
          ${topics.length ? `<div class="t-topics">Argomenti: ${topics.map(c => esc(CONCEPT_NAMES[c] || c)).join(', ')}</div>` : ''}
        </div>
      </div>
      <div class="ticket-foot"><button class="cta small">📅 Aggiungi al calendario</button><span>Demo: nessuna email viene inviata</span></div>
    </div>`, 900);
  ticket.querySelector('.ticket-foot .cta').onclick = () => downloadIcs(payload, code, topics);
  await botSay('Nel frattempo, se vuoi, puoi ricominciare il percorso e tornare in aula quando vuoi. A presto! 👋');
}

async function requestCallback(topics) {
  let band = null;
  await botSay('Ottimo! Dimmi quando preferisci essere chiamato e lascia il tuo numero. 📞');
  const { payload, code } = await contactForm(`<div class="book-card">
      <div class="book-step"><div class="step-label"><span>1</span>Quando preferisci essere chiamato?</div>
        <div class="pick-row bands" data-g="band">${Object.entries(BANDS).map(([v, l]) => `<button class="pill" data-v="${v}" aria-pressed="false">${l}</button>`).join('')}</div></div>
      <div class="book-step"><div class="step-label"><span>2</span>I tuoi dati</div>
        <div class="fields">
          <label><span>Nome</span><input data-f="name" maxlength="80" autocomplete="given-name" placeholder="Come ti chiami?"></label>
          <label><span>Telefono</span><input data-f="phone" type="tel" maxlength="20" autocomplete="tel" placeholder="+39 333 1234567"></label>
        </div></div>
      ${consentHtml()}
      <div class="answer-foot"><span class="hint"></span><button class="cta" disabled>Richiamami 📞</button></div>
    </div>`,
    form => pickGroup(form.querySelector('[data-g="band"]'), v => band = v),
    () => ({ type: 'callback', topics, band, name: valueOf('name'), phone: valueOf('phone'), consent: true }),
    form => {
      if (!band) return '👆 Scegli una fascia oraria';
      if (valueOf('name').length < 2) return '✍️ Scrivi il tuo nome';
      if (!/^\+?[0-9 ]{6,20}$/.test(valueOf('phone'))) return '📱 Inserisci un numero di telefono valido';
      if (!form.querySelector('[data-f="consent"]').checked) return '☑️ Serve il consenso per procedere';
      return '';
    });

  const masked = payload.phone.replace(/\s/g, '').replace(/\d(?=\d{2})/g, '•');
  userSay(`${BANDS[payload.band]} · ${esc(masked)}`);
  await botSay('Ricevuto! 🙌 Un esperto ti richiamerà nella fascia che hai scelto.');
  await botBlock(`<div class="ticket">
      <div class="ticket-top">📞 Richiesta di richiamata <span>${esc(code)}</span></div>
      <div class="ticket-body">
        <div class="cal phone" aria-hidden="true"><span class="cd">📞</span></div>
        <div class="ticket-info">
          <div class="t-time">${BANDS[payload.band]}</div>
          <div>Ti chiamerà un esperto FinGenius al numero ${esc(masked)}</div>
          <div class="t-who">Per ${esc(payload.name)} · di solito entro 1 giorno lavorativo</div>
          ${topics.length ? `<div class="t-topics">Argomenti: ${topics.map(c => esc(CONCEPT_NAMES[c] || c)).join(', ')}</div>` : ''}
        </div>
      </div>
      <div class="ticket-foot"><span>Demo: nessuna chiamata verrà effettuata</span></div>
    </div>`, 900);
  await botSay('Nel frattempo, se vuoi, puoi ricominciare il percorso e tornare in aula quando vuoi. A presto! 👋');
}

function valueOf(field) {
  return (valueOf.form?.querySelector(`[data-f="${field}"]`)?.value || '').trim();
}

function downloadIcs({ day, slot, mode }, code, topics) {
  const start = new Date(`${day}T${slot}:00`);
  const end = new Date(start.getTime() + 30 * 60000);
  const fmt = d => d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const ics = [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//FinGenius 360//IT', 'BEGIN:VEVENT',
    `UID:${code}@fingenius360`, `DTSTAMP:${fmt(new Date())}`, `DTSTART:${fmt(start)}`, `DTEND:${fmt(end)}`,
    'SUMMARY:FinGenius 360 - Sessione con un esperto',
    `DESCRIPTION:${MODES[mode].replace(/^\S+\s/, '')} - codice ${code}. Argomenti: ${topics.map(c => CONCEPT_NAMES[c] || c).join(', ') || 'ripasso generale'}`,
    'END:VEVENT', 'END:VCALENDAR'
  ].join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' }));
  a.download = `fingenius-${code}.ics`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

start();
</script>
